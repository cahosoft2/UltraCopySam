ShortDescription: Fast low-level directory copy tool for Windows, powered by the native CopyFileExW API.
Description: |-
  UltraCopySam copies an entire directory tree to another location, overwriting
  whatever is there without asking, as fast as the hardware allows.

  It calls the native Win32 API directly, so the Windows kernel moves the bytes
  and they never pass through the program's buffers. A worker pool walks the
  tree and copies at the same time, with no barrier between listing and copying.

  Features:
  - Low-level copying through CopyFileExW, with unbuffered I/O for large files.
  - True parallelism with a configurable worker count.
  - Incremental mode (-u) that skips files whose size and timestamp already
    match at the destination.
  - Resume mode (-r) that resumes interrupted copies using a session state file.
  - Support for paths longer than 260 characters via the \\?\ extended prefix.
  - Fault tolerant: a locked file does not abort the copy.
  - Clear, explanatory error messages instead of numeric codes.
  - A single executable with no dependencies.
